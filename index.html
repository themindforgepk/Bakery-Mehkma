<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بیکری انڈسٹری - شامل ہوں</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#F37021',
            background: '#F8F9FA',
            card: '#FFFFFF',
            text: '#2D2D2D',
            whatsapp: '#25D366',
          },
          fontFamily: {
            urdu: ['"Noto Nastaliq Urdu"', 'serif'],
          },
          boxShadow: {
            soft: '0 4px 20px rgba(0, 0, 0, 0.08)',
            'soft-lg': '0 10px 40px rgba(0, 0, 0, 0.12)',
          }
        }
      }
    }
  </script>
  <style>
    * {
      font-family: 'Noto Nastaliq Urdu', serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #F8F9FA;
      color: #2D2D2D;
      overscroll-behavior: none;
    }
    .chip {
      transition: all 0.2s ease;
    }
    .chip.selected {
      background-color: #F37021 !important;
      color: white !important;
      border-color: #F37021 !important;
    }
    .bottom-sheet {
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .bottom-sheet.open {
      transform: translateY(0);
    }
    .fade-in {
      animation: fadeIn 0.4s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse-counter {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #F37021;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    input[type="tel"], input[type="password"], input[type="text"] {
      direction: ltr;
      text-align: left;
    }
    .admin-table th, .admin-table td {
      padding: 10px 12px;
      text-align: right;
      border-bottom: 1px solid #eee;
    }
    .admin-table th {
      background: #f1f5f9;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-background min-h-screen font-urdu">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Skills & Cities
    const SKILLS = ['خمیرا', 'مٹھائی', 'فاسٹ فوڈ', 'بسکٹ', 'رنگائی', 'آل راؤنڈر'];
    const CITIES = ['لاہور', 'کراچی', 'اسلام آباد', 'فیصل آباد', 'ملتان', 'دیگر'];

    // Storage helpers
    const STORAGE_KEY = 'bakery_mehkma_entries';
    const PASS_KEY = 'bakery_mehkma_admin_pass';
    const DEFAULT_PASS = 'mehkma';

    const getEntries = () => {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    };
    const saveEntry = (entry) => {
      try {
        const entries = getEntries();
        entries.unshift({ ...entry, id: Date.now(), timestamp: new Date().toISOString() });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        return entries.length;
      } catch (e) {
        return 0;
      }
    };

    // Password helpers (stored in localStorage)
    const getAdminPass = () => {
      return localStorage.getItem(PASS_KEY) || DEFAULT_PASS;
    };
    const setAdminPass = (newPass) => {
      localStorage.setItem(PASS_KEY, newPass);
    };

    // Live counter base
    const BASE_COUNT = 1500;

    function App() {
      const [screen, setScreen] = useState('home');
      const [role, setRole] = useState(null);
      const [step, setStep] = useState(1);
      const [skill, setSkill] = useState('');
      const [city, setCity] = useState('');
      const [whatsapp, setWhatsapp] = useState('');
      const [loading, setLoading] = useState(false);
      const [entryCount, setEntryCount] = useState(BASE_COUNT);
      const [adminClickCount, setAdminClickCount] = useState(0);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState('');

      // Password change states
      const [showChangePass, setShowChangePass] = useState(false);
      const [currentPass, setCurrentPass] = useState('');
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const [passMsg, setPassMsg] = useState('');
      const [passMsgType, setPassMsgType] = useState(''); // success | error

      useEffect(() => {
        const real = getEntries().length;
        setEntryCount(BASE_COUNT + real);
      }, [screen]);

      const openForm = (selectedRole) => {
        setRole(selectedRole);
        setStep(selectedRole === 'owner' ? 2 : 1);
        setSkill('');
        setCity('');
        setWhatsapp('');
        setLoading(false);
        setScreen('form');
      };

      const closeForm = () => {
        setScreen('home');
        setRole(null);
        setStep(1);
        setLoading(false);
      };

      const handleSubmit = () => {
        const cleanWhatsapp = whatsapp.replace(/\D/g, '');
        if (!city) return;
        if (cleanWhatsapp.length < 10) return;
        if (role !== 'owner' && !skill) return;

        setLoading(true);

        const timer = setTimeout(() => {
          try {
            const entry = {
              role: role === 'owner' ? 'مالک' : role === 'master' ? 'مستری' : 'کاریگر',
              skill: role === 'owner' ? '-' : skill,
              city,
              whatsapp: '+92' + cleanWhatsapp.replace(/^0+/, '').slice(0, 10),
            };
            const newCount = saveEntry(entry);
            setEntryCount(BASE_COUNT + newCount);
          } catch (err) {}
          setLoading(false);
          setScreen('success');
        }, 900);

        setTimeout(() => {
          clearTimeout(timer);
          setLoading(false);
          if (screen === 'form') setScreen('success');
        }, 3000);
      };

      const getVipLabel = () => {
        if (role === 'owner') return 'VIP مالک';
        if (role === 'master') return 'VIP مستری';
        return 'VIP کاریگر';
      };

      const getVipInviteText = () => {
        if (role === 'owner') return '۱۰ مالکان';
        if (role === 'master') return '۱۰ مستری';
        return '۱۰ کاریگروں';
      };

      const shareWhatsApp = () => {
        const vip = getVipLabel();
        const text = encodeURIComponent(
          `🎉 بیکری انڈسٹری کا نیا نظام آنے والا ہے!\n\nمیں نے شامل ہو گیا ہے۔ آپ بھی شامل ہوں اور افتتاح پر ${vip} بنیں۔\n\nلنک: ${window.location.href}`
        );
        window.open(`https://wa.me/?text=${text}`, '_blank');
      };

      const handleCounterClick = () => {
        const next = adminClickCount + 1;
        setAdminClickCount(next);
        if (next >= 7) {
          setAdminClickCount(0);
          setAdminPassword('');
          setAdminError('');
          setScreen('adminLogin');
        }
      };

      const handleAdminLogin = () => {
        const correct = getAdminPass();
        if (adminPassword.trim() === correct) {
          setAdminError('');
          setShowChangePass(false);
          setPassMsg('');
          setScreen('admin');
        } else {
          setAdminError('غلط پاس ورڈ۔ دوبارہ کوشش کریں۔');
          setAdminPassword('');
        }
      };

      const handleChangePassword = () => {
        setPassMsg('');
        const correct = getAdminPass();

        if (currentPass !== correct) {
          setPassMsg('موجودہ پاس ورڈ غلط ہے');
          setPassMsgType('error');
          return;
        }
        if (!newPass || newPass.length < 4) {
          setPassMsg('نیا پاس ورڈ کم از کم ۴ حروف کا ہو');
          setPassMsgType('error');
          return;
        }
        if (newPass !== confirmPass) {
          setPassMsg('نیا پاس ورڈ اور تصدیق ایک جیسے نہیں ہیں');
          setPassMsgType('error');
          return;
        }

        setAdminPass(newPass);
        setPassMsg('پاس ورڈ کامیابی سے تبدیل ہو گیا!');
        setPassMsgType('success');
        setCurrentPass('');
        setNewPass('');
        setConfirmPass('');
        setTimeout(() => {
          setShowChangePass(false);
          setPassMsg('');
        }, 2000);
      };

      const formatNum = (n) => n.toLocaleString('en-PK');

      // ========== HOME ==========
      if (screen === 'home') {
        return (
          <div className="min-h-screen flex flex-col px-4 pt-8 pb-10 max-w-lg mx-auto">
            <div className="text-center mb-8 fade-in">
              <h1 className="text-2xl md:text-3xl font-bold leading-relaxed text-text mb-3">
                بیکری انڈسٹری کے ایک نئے نظام کا افتتاح ہونے جا رہا ہے
              </h1>
              <p className="text-base text-primary font-medium mb-5 leading-relaxed">
                اب کام ڈھونڈنا بہت آسان اور تیز ہوگا
              </p>
              <div
                onClick={handleCounterClick}
                className="inline-flex items-center gap-2 bg-white rounded-full px-5 py-2.5 shadow-soft cursor-pointer select-none"
              >
                <span className="w-2.5 h-2.5 bg-green-500 rounded-full pulse-counter"></span>
                <span className="text-sm md:text-base text-text">
                  اب تک <span className="font-bold text-primary">{formatNum(entryCount)}+</span> لوگ شامل ہو چکے ہیں
                </span>
              </div>
            </div>

            <div className="flex flex-col gap-4 flex-1">
              <div onClick={() => openForm('owner')} className="bg-card rounded-2xl p-5 shadow-soft active:scale-[0.98] transition-transform cursor-pointer fade-in">
                <div className="flex items-start gap-4">
                  <div className="text-4xl">🏢</div>
                  <div className="flex-1">
                    <h2 className="text-lg font-bold mb-1">میں بیکری کا مالک ہوں</h2>
                    <p className="text-sm text-gray-500 mb-4">سٹاف چاہیے؟ شامل ہوں</p>
                    <button className="w-full bg-primary text-white py-3 rounded-xl font-medium text-base shadow-md">سٹاف چاہیے؟ شامل ہوں</button>
                  </div>
                </div>
              </div>

              <div onClick={() => openForm('master')} className="bg-card rounded-2xl p-5 shadow-soft active:scale-[0.98] transition-transform cursor-pointer fade-in">
                <div className="flex items-start gap-4">
                  <div className="text-4xl">👷</div>
                  <div className="flex-1">
                    <h2 className="text-lg font-bold mb-1">میں مستری / ذمہ دار ہوں</h2>
                    <p className="text-sm text-gray-500 mb-4">کام چاہیے؟ شامل ہوں</p>
                    <button className="w-full bg-primary text-white py-3 rounded-xl font-medium text-base shadow-md">کام چاہیے؟ شامل ہوں</button>
                  </div>
                </div>
              </div>

              <div onClick={() => openForm('worker')} className="bg-card rounded-2xl p-5 shadow-soft active:scale-[0.98] transition-transform cursor-pointer fade-in">
                <div className="flex items-start gap-4">
                  <div className="text-4xl">👨‍🍳</div>
                  <div className="flex-1">
                    <h2 className="text-lg font-bold mb-1">میں کاریگر ہوں</h2>
                    <p className="text-sm text-gray-500 mb-4">کام چاہیے؟ شامل ہوں</p>
                    <button className="w-full bg-primary text-white py-3 rounded-xl font-medium text-base shadow-md">کام چاہیے؟ شامل ہوں</button>
                  </div>
                </div>
              </div>
            </div>

            <p className="text-center text-xs text-gray-400 mt-8">افتتاح جلد۔ سب سے پہلے آپ کو اطلاع ملے گی۔</p>
          </div>
        );
      }

      // ========== FORM ==========
      if (screen === 'form') {
        const needsSkill = role !== 'owner';
        const cleanNum = whatsapp.replace(/\D/g, '');
        const canSubmit = !!city && cleanNum.length >= 10 && (!needsSkill || !!skill);

        return (
          <div className="fixed inset-0 z-50 flex flex-col justify-end">
            <div className="absolute inset-0 bg-black/40" onClick={closeForm}></div>
            <div className="relative bg-white rounded-t-3xl shadow-soft-lg max-h-[90vh] overflow-y-auto bottom-sheet open">
              <div className="flex justify-center pt-3 pb-1">
                <div className="w-12 h-1.5 bg-gray-300 rounded-full"></div>
              </div>
              <div className="px-5 pb-8 pt-2">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold">
                    {role === 'owner' ? '🏢 مالک' : role === 'master' ? '👷 مستری' : '👨‍🍳 کاریگر'}
                  </h3>
                  <button onClick={closeForm} className="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 text-lg">✕</button>
                </div>

                {needsSkill && (
                  <div className="mb-6 fade-in">
                    <p className="text-base font-medium mb-3">آپ کا ہنر کیا ہے؟</p>
                    <div className="flex flex-wrap gap-2">
                      {SKILLS.map((s) => (
                        <button key={s} type="button" onClick={() => { setSkill(s); setStep(2); }}
                          className={`chip px-4 py-2.5 rounded-full border-2 text-sm font-medium ${skill === s ? 'selected' : 'bg-white border-gray-200 text-text'}`}>
                          {s}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {(step >= 2 || !needsSkill) && (
                  <div className="mb-6 fade-in">
                    <p className="text-base font-medium mb-3">آپ کا شہر کون سا ہے؟</p>
                    <div className="flex flex-wrap gap-2">
                      {CITIES.map((c) => (
                        <button key={c} type="button" onClick={() => { setCity(c); setStep(3); }}
                          className={`chip px-4 py-2.5 rounded-full border-2 text-sm font-medium ${city === c ? 'selected' : 'bg-white border-gray-200 text-text'}`}>
                          {c}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {step >= 3 && (
                  <div className="mb-8 fade-in">
                    <p className="text-base font-medium mb-3">زبردست! ہم آپ کو افتتاح کی تفصیلات کہاں بھیجیں؟</p>
                    <div className="flex items-center bg-gray-50 border-2 border-gray-200 rounded-xl overflow-hidden focus-within:border-primary">
                      <span className="px-4 py-3.5 bg-gray-100 text-gray-600 font-medium text-base border-l border-gray-200">+92</span>
                      <input type="tel" inputMode="numeric" pattern="[0-9]*" maxLength="11" placeholder="3XXXXXXXXX"
                        value={whatsapp} onChange={(e) => setWhatsapp(e.target.value.replace(/\D/g, '').slice(0, 11))}
                        className="flex-1 px-4 py-3.5 bg-transparent outline-none text-base" dir="ltr" />
                    </div>
                    <p className="text-xs text-gray-400 mt-2">صرف واٹس ایپ نمبر (10 یا 11 ہندسے)</p>
                  </div>
                )}

                {step >= 3 && (
                  <button type="button" onClick={handleSubmit} disabled={!canSubmit || loading}
                    className={`w-full py-4 rounded-2xl text-white text-lg font-bold shadow-md transition-all ${canSubmit && !loading ? 'bg-primary active:scale-[0.98]' : 'bg-gray-300 cursor-not-allowed'}`}>
                    {loading ? (
                      <span className="flex items-center justify-center gap-2">
                        <span className="loading-spinner !w-5 !h-5 !border-2"></span>
                        شامل ہو رہے ہیں...
                      </span>
                    ) : 'شامل ہوں 🚀'}
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ========== SUCCESS ==========
      if (screen === 'success') {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center px-5 py-10 max-w-lg mx-auto text-center fade-in">
            <div className="text-6xl mb-6">🎉</div>
            <h2 className="text-2xl font-bold leading-relaxed mb-4">زبردست! آپ کی انٹری ہو گئی ہے۔</h2>
            <p className="text-base text-gray-600 leading-relaxed mb-10">
              جیسے ہی ایپ کا باقاعدہ افتتاح ہوگا، ہم سب سے پہلے آپ کو واٹس ایپ پر اطلاع دیں گے۔
            </p>
            <button type="button" onClick={shareWhatsApp}
              className="w-full bg-whatsapp text-white py-4 rounded-2xl text-base font-bold shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] mb-6">
              <span className="text-xl">📲</span>
              اپنے دوستوں کو بھی بلائیں!
            </button>
            <p className="text-sm text-gray-500 leading-relaxed px-2">
              اپنے لنک سے {getVipInviteText()} کو شامل کروائیں اور ایپ کے افتتاح پر{' '}
              <span className="font-bold text-primary">‘{getVipLabel()}’</span> کا درجہ حاصل کریں۔
            </p>
            <button type="button" onClick={() => { setLoading(false); setScreen('home'); }}
              className="mt-10 text-primary font-medium text-sm underline">واپس جائیں</button>
          </div>
        );
      }

      // ========== ADMIN LOGIN ==========
      if (screen === 'adminLogin') {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center px-5 py-10 max-w-sm mx-auto">
            <div className="bg-white rounded-2xl shadow-soft p-6 w-full fade-in">
              <h2 className="text-xl font-bold text-center mb-2">بانی لاگ ان</h2>
              <p className="text-sm text-gray-500 text-center mb-6">صرف بانی کے لیے</p>
              <input type="password" placeholder="پاس ورڈ درج کریں" value={adminPassword}
                onChange={(e) => { setAdminPassword(e.target.value); setAdminError(''); }}
                onKeyDown={(e) => e.key === 'Enter' && handleAdminLogin()}
                className="w-full px-4 py-3.5 border-2 border-gray-200 rounded-xl outline-none focus:border-primary mb-3 text-base" dir="ltr" autoFocus />
              {adminError && <p className="text-red-500 text-sm mb-3 text-center">{adminError}</p>}
              <button type="button" onClick={handleAdminLogin} className="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-base mb-3">لاگ ان</button>
              <button type="button" onClick={() => setScreen('home')} className="w-full text-gray-500 text-sm py-2">واپس جائیں</button>
            </div>
          </div>
        );
      }

      // ========== ADMIN DASHBOARD ==========
      if (screen === 'admin') {
        const entries = getEntries();
        return (
          <div className="min-h-screen bg-background px-4 py-6 max-w-3xl mx-auto">
            <div className="flex items-center justify-between mb-6">
              <h1 className="text-xl font-bold">بانی ڈیش بورڈ</h1>
              <button type="button" onClick={() => setScreen('home')} className="px-4 py-2 bg-white rounded-lg shadow-soft text-sm font-medium">واپس</button>
            </div>

            <div className="bg-white rounded-2xl shadow-soft p-5 mb-6">
              <p className="text-sm text-gray-500 mb-1">کل انٹریز</p>
              <p className="text-3xl font-bold text-primary">{entries.length}</p>
              <p className="text-xs text-gray-400 mt-1">(بیس کاؤنٹر: {formatNum(BASE_COUNT)} + حقیقی: {entries.length})</p>
            </div>

            {entries.length === 0 ? (
              <div className="bg-white rounded-2xl shadow-soft p-8 text-center text-gray-500 mb-6">ابھی کوئی انٹری نہیں ہے۔</div>
            ) : (
              <div className="bg-white rounded-2xl shadow-soft overflow-hidden mb-6">
                <div className="overflow-x-auto">
                  <table className="w-full admin-table text-sm">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>کردار</th>
                        <th>ہنر</th>
                        <th>شہر</th>
                        <th>واٹس ایپ</th>
                        <th>وقت</th>
                      </tr>
                    </thead>
                    <tbody>
                      {entries.map((e, i) => (
                        <tr key={e.id || i}>
                          <td>{i + 1}</td>
                          <td>{e.role}</td>
                          <td>{e.skill || '-'}</td>
                          <td>{e.city}</td>
                          <td dir="ltr" className="text-left font-mono text-xs">{e.whatsapp}</td>
                          <td className="text-xs text-gray-500">
                            {new Date(e.timestamp).toLocaleString('ur-PK', { dateStyle: 'short', timeStyle: 'short' })}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Password Change Section */}
            <div className="bg-white rounded-2xl shadow-soft p-5">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-bold text-base">پاس ورڈ تبدیل کریں</h3>
                <button
                  type="button"
                  onClick={() => {
                    setShowChangePass(!showChangePass);
                    setPassMsg('');
                    setCurrentPass('');
                    setNewPass('');
                    setConfirmPass('');
                  }}
                  className="text-primary text-sm font-medium"
                >
                  {showChangePass ? 'بند کریں' : 'تبدیل کریں'}
                </button>
              </div>

              {showChangePass && (
                <div className="space-y-3 fade-in">
                  <input
                    type="password"
                    placeholder="موجودہ پاس ورڈ"
                    value={currentPass}
                    onChange={(e) => setCurrentPass(e.target.value)}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-primary text-sm"
                    dir="ltr"
                  />
                  <input
                    type="password"
                    placeholder="نیا پاس ورڈ (کم از کم ۴ حروف)"
                    value={newPass}
                    onChange={(e) => setNewPass(e.target.value)}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-primary text-sm"
                    dir="ltr"
                  />
                  <input
                    type="password"
                    placeholder="نیا پاس ورڈ دوبارہ لکھیں"
                    value={confirmPass}
                    onChange={(e) => setConfirmPass(e.target.value)}
                    className="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-primary text-sm"
                    dir="ltr"
                  />
                  {passMsg && (
                    <p className={`text-sm text-center ${passMsgType === 'success' ? 'text-green-600' : 'text-red-500'}`}>
                      {passMsg}
                    </p>
                  )}
                  <button
                    type="button"
                    onClick={handleChangePassword}
                    className="w-full bg-primary text-white py-3 rounded-xl font-bold text-sm"
                  >
                    پاس ورڈ محفوظ کریں
                  </button>
                </div>
              )}
            </div>

            <p className="text-center text-xs text-gray-400 mt-8">ڈیٹا صرف اس ڈیوائس پر محفوظ ہے۔ (لوکل اسٹوریج)</p>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
